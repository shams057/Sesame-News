<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes tickets – SESAME</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="tickets">

  <!-- Sidebar et logo : remplis automatiquement par script.js -->
  <aside id="zone-sidebar"></aside>

  <div class="contenu">
    <!-- Barre supérieure : remplie automatiquement par script.js -->
    <div id="zone-topbar"></div>

    <main class="page page-tickets">

      <!-- Colonne principale : titre, statistiques, recherche, liste -->
      <div class="colonne-principale">
        <div class="entete-page">
          <div class="titre-icone">
            <span class="gros-icone">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 8a2 2 0 002-2h12a2 2 0 002 2v2a2 2 0 000 4v2a2 2 0 00-2 2H6a2 2 0 00-2-2v-2a2 2 0 000-4z"
                  transform="rotate(-20 12 12)" />
                <path d="M10 9l4 6" transform="rotate(-20 12 12)" stroke-dasharray="1.5 2.5" />
              </svg>
            </span>
            <div>
              <h1>Mes tickets</h1>
              <p class="sous-titre">Suivez vos demandes administratives</p>
            </div>
          </div>
          <button type="button" class="btn" id="btn-nouveau-ticket">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Nouveau ticket
          </button>
        </div>

        <!-- Statistiques (mises à jour automatiquement) -->
        <section class="grille col-3" aria-label="Statistiques des tickets">
          <div class="carte stat">
            <div class="pastille-icone"><svg class="icone" viewBox="0 0 24 24">
                <path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z" />
                <path d="M14 3v5h5M9 13h6M9 17h4" />
              </svg></div>
            <div>
              <div class="libelle">Total</div>
              <div class="nombre" id="stat-total">0</div>
            </div>
          </div>
          <div class="carte stat ouverts">
            <div class="pastille-icone"><svg class="icone" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
              </svg></div>
            <div>
              <div class="libelle">Ouverts</div>
              <div class="nombre" id="stat-ouverts">0</div>
            </div>
          </div>
          <div class="carte stat fermes">
            <div class="pastille-icone"><svg class="icone" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M8 12l3 3 5-6" />
              </svg></div>
            <div>
              <div class="libelle">Fermés</div>
              <div class="nombre" id="stat-fermes">0</div>
            </div>
          </div>
        </section>

        <!-- Recherche et filtres -->
        <div class="barre-outils">
          <label class="recherche-globale" for="recherche-tickets">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.3-4.3" />
            </svg>
            <input type="search" id="recherche-tickets" placeholder="Rechercher un ticket…">
          </label>
          <div class="filtres" id="filtres-tickets" role="group" aria-label="Filtrer par statut">
            <button type="button" class="actif" data-filtre="tous">Tous</button>
            <button type="button" data-filtre="ouvert">Ouverts</button>
            <button type="button" data-filtre="ferme">Fermés</button>
          </div>
        </div>

        <section class="liste-tickets" id="liste-tickets" aria-live="polite"></section>
      </div>

      <!-- Panneau de détails du ticket sélectionné -->
      <aside class="carte panneau-details" id="panneau-details" aria-label="Détails du ticket"></aside>
    </main>
  </div>

  <!-- Fenêtre : Nouveau ticket -->
  <div class="voile" id="modale-ticket" role="dialog" aria-modal="true" aria-labelledby="titre-modale">
    <div class="modale">
      <div class="modale-tete">
        <h2 id="titre-modale">Nouveau ticket</h2>
        <button type="button" class="btn-icone" id="btn-fermer-modale" aria-label="Fermer">
          <svg class="icone" viewBox="0 0 24 24">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
      <form id="form-ticket" novalidate>
        <div class="champ">
          <label for="ticket-sujet">Sujet</label>
          <input type="text" id="ticket-sujet" placeholder="Ex. : Demande de relevé de notes" maxlength="100">
          <span class="erreur-msg">Le sujet doit contenir au moins 5 caractères.</span>
        </div>
        <div class="champ">
          <label for="ticket-categorie">Catégorie</label>
          <select id="ticket-categorie">
            <option value="">Choisir une catégorie…</option>
            <option>Administratif</option>
            <option>Inscription</option>
            <option>Financier</option>
            <option>Pédagogique</option>
            <option>Technique</option>
            <option>Autre</option>
          </select>
          <span class="erreur-msg">Veuillez choisir une catégorie.</span>
        </div>
        <div class="champ">
          <label for="ticket-description">Description</label>
          <textarea id="ticket-description"
            placeholder="Décrivez votre demande avec le plus de détails possible…"></textarea>
          <span class="erreur-msg">La description doit contenir au moins 15 caractères.</span>
        </div>
        <div class="modale-actions">
          <button type="button" class="btn secondaire" id="btn-annuler-ticket">Annuler</button>
          <button type="submit" class="btn">Envoyer le ticket</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="script.js"></script>
</body>

</html>
