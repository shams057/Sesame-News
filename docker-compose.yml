# Local stack: MySQL + API + back-office.
#   cp Backend/.env.example .env.docker   (set JWT_SECRET, SEED_ADMIN_*)
#   docker compose --env-file .env.docker up --build
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sesame_news
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 20

  api:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sesame_news
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (48+ random bytes)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Tunis}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-YOUR_MODEL_NAME}
      LLM_API_KEY: ${LLM_API_KEY:-YOUR_API_KEY}
      SEED_ADMIN_LOGIN: ${SEED_ADMIN_LOGIN:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

  admin:
    build:
      context: ./sesame-superadmin
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    depends_on: [api]
    ports:
      - "8080:80"

volumes:
  db-data:
  uploads:
